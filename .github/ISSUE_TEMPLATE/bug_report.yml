name: Relatar um bug
description: Registre um problema reproduzível no ZooQuest.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Resumo
      description: Descreva o problema de forma objetiva.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Commit ou branch
      description: Informe a branch ou o SHA em que o problema foi observado.
      placeholder: develop ou abc1234
    validations:
      required: true

  - type: input
    id: godot
    attributes:
      label: Versão do Godot
      placeholder: 4.7.2.stable
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Passos para reproduzir
      description: Liste a sequência mínima que reproduz o problema.
      placeholder: |
        1. Iniciar o jogo com F5.
        2. Entrar na fase afetada.
        3. Executar a ação que produz o problema.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Resultado esperado
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Resultado observado
    validations:
      required: true

  - type: dropdown
    id: reproducibility
    attributes:
      label: Frequência
      options:
        - Sempre
        - Frequentemente
        - Ocasionalmente
        - Uma vez
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Logs e evidências
      description: Inclua mensagens relevantes do Debugger e anexos que ajudem a reproduzir o problema.
